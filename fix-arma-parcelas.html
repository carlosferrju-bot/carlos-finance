<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CARLOS FINANCE — Restaurar parcelas ARMA</title>
<style>
body{margin:0;background:#050711;color:#fff;font:16px Arial,sans-serif;display:grid;place-items:center;min-height:100vh;text-align:center}.box{max-width:760px;padding:32px}.ok{color:#00f5a0;font-weight:800}.muted{color:#9aacbf}.err{color:#ff6b81}.step{margin-top:12px;color:#c9d8e8}
</style>
</head>
<body><div class="box"><h1>Restaurando parcelas…</h1><p id="status" class="muted">Corrigindo os registros da compra ARMA sem restaurar a parcela de agosto.</p></div>
<script>
(async function(){
 const status=document.getElementById('status');
 const KEY='neonFinanceV1';
 const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
 const norm=v=>String(v??'').normalize('NFKC').replace(/[–—−]/g,'-').replace(/\s+/g,' ').trim().toLocaleLowerCase('pt-BR');
 const isArma=v=>norm(v)==='arma';
 try{
  // Executa no MESMO domínio do CARLOS FINANCE e limpa apenas caches/SW antigos.
  if('serviceWorker' in navigator){
    const regs=await navigator.serviceWorker.getRegistrations();
    await Promise.all(regs.map(r=>r.unregister().catch(()=>false)));
  }
  if('caches' in window){
    const names=await caches.keys();
    await Promise.all(names.map(n=>caches.delete(n).catch(()=>false)));
  }

  const raw=localStorage.getItem(KEY);
  if(!raw) throw new Error('Dados do CARLOS FINANCE não encontrados neste navegador. Abra esta página pelo mesmo endereço do seu CARLOS FINANCE: finance-silk-iota.vercel.app.');
  const db=JSON.parse(raw);
  if(!db||typeof db!=='object')throw new Error('Dados inválidos.');
  if(!Array.isArray(db.transactions))db.transactions=[];
  if(!Array.isArray(db.bills))db.bills=[];
  if(!Array.isArray(db.deletedInstallmentBills))db.deletedInstallmentBills=[];
  if(!Array.isArray(db.deletedBillSignatures))db.deletedBillSignatures=[];

  // Localiza a origem real da compra ARMA. Não altera outras compras parceladas.
  let source=db.transactions.find(t=>t&&t.type==='expense'&&isArma(t.desc)&&String(t.date||'')==='2026-08-24'&&Number(t.installments)===4);
  if(!source){
    source={
      id:'arma-restored-'+uid(),
      type:'expense',
      date:'2026-08-24',
      desc:'ARMA',
      amount:1750.92,
      category:(db.categories||[]).find(c=>norm(c.name)==='outros')?.id || 'cat9',
      nature:'variable',
      payment:'Conta / Pix',
      cardId:'',
      installments:4,
      note:'Parcela 1/4',
      createdAt:new Date().toISOString().slice(0,10)
    };
    db.transactions.unshift(source);
  }

  // A parcela 1/4 (agosto) deve continuar excluída.
  // Apenas 2/4, 3/4 e 4/4 são liberadas.
  for(let i=2;i<=4;i++){
    const key=source.id+'|'+i;
    const sourceSig='installment-source|'+source.id+'|'+i;
    db.deletedInstallmentBills=db.deletedInstallmentBills.filter(k=>String(k)!==key);
    db.deletedBillSignatures=db.deletedBillSignatures.filter(s=>String(s)!==sourceSig);
  }

  // Remove assinaturas antigas que bloqueavam especificamente as parcelas futuras da ARMA.
  // A assinatura de agosto não é tocada.
  db.deletedBillSignatures=db.deletedBillSignatures.filter(s=>{
    const x=String(s);
    if(!x.toLocaleLowerCase('pt-BR').includes('arma'))return true;
    const m=x.match(/installment-signature\\|(.+?)\\|(2026-(09|10|11)-[0-9]{2})\\|437\\.73$/i);
    return !m;
  });

  const amount=437.73;
  const catName=(db.categories||[]).find(c=>c.id===source.category)?.name || 'Outros';
  const createdAt=new Date().toISOString().slice(0,10);
  const restored=[];

  for(let i=2;i<=4;i++){
    const d=new Date('2026-08-24T12:00:00');
    d.setMonth(d.getMonth()+i-1);
    const due=d.toISOString().slice(0,10);
    const desc=`ARMA — parcela ${i}/4`;
    let bill=db.bills.find(b=>b&&b.fromInstallmentId===source.id&&Number(b.installmentNumber)===i);
    if(!bill){
      bill=db.bills.find(b=>b&&norm(b.desc)===norm(desc)&&String(b.due||'')===due);
    }
    if(!bill){
      db.bills.push({id:uid(),desc,category:source.category,categoryName:catName,amount,due,nature:'variable',payment:'Conta / Pix',recurring:'no',recurringKey:'',fromInstallmentId:source.id,installmentNumber:i,installmentTotal:4,note:`Parcela ${i}/4`,paid:false,paidDate:'',createdAt});
      restored.push(desc+' — '+due);
    }else{
      bill.fromInstallmentId=source.id;
      bill.installmentNumber=i;
      bill.installmentTotal=4;
      bill.amount=amount;
      bill.due=due;
      bill.category=source.category;
      bill.categoryName=catName;
    }
  }

  localStorage.setItem(KEY,JSON.stringify(db));
  status.innerHTML='<span class="ok">✓ Correção concluída.</span><div class="step">Setembro, outubro e novembro foram restaurados.</div><div class="step">A parcela de agosto continua excluída.</div><div class="step">Nenhuma outra conta foi alterada.</div>';
  setTimeout(()=>location.replace('/?arma_restore='+Date.now()),1500);
 }catch(e){
  console.error(e);
  status.innerHTML='<span class="err">Não foi possível concluir a correção.</span><br><br>'+String(e.message||e);
 }
})();
</script></body></html>
