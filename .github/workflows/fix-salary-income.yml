name: Fix salary income selector

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch salary and income categories
        shell: bash
        run: |
          set -e
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='/* SALARY_INCOME_SELECTOR_FIX_V1 */'
          if marker in s:
              print('Salary income fix already applied.')
              raise SystemExit(0)

          old='''function fillSelects(){let expense=db.categories.filter(c=>c.type==="expense"),all=db.categories;["txCategory","fixedCategory","billCategory"].forEach(id=>$(id).innerHTML=expense.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join(""));$("txCard").innerHTML='<option value="">Nenhum</option>'+db.cards.map(c=>`<option value="${c.id}">${esc(c.name)} • final ${esc(c.last4||"----")}</option>`).join("")}'''
          new='''/* SALARY_INCOME_SELECTOR_FIX_V1 */\nfunction fillSelects(){\n  const txType=$("txType").value;\n  const txCategories=db.categories.filter(c=>c.type===(txType==="income"?"income":"expense"));\n  const expense=db.categories.filter(c=>c.type==="expense");\n  $("txCategory").innerHTML=txCategories.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join("");\n  ["fixedCategory","billCategory"].forEach(id=>$(id).innerHTML=expense.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join(""));\n  $("txCard").innerHTML='<option value="">Nenhum</option>'+db.cards.map(c=>`<option value="${c.id}">${esc(c.name)} • final ${esc(c.last4||"----")}</option>`).join("");\n  $("txCard").disabled=$("txPayment").value!=="credit";\n}\n$("txType").onchange=()=>{fillSelects();};'''
          if old not in s:
              raise SystemExit('fillSelects marker not found')
          s=s.replace(old,new,1)

          old_norm='''  db.categories=clean;\n  for(const list of [db.transactions,db.fixed,db.bills]){'''
          new_norm='''  db.categories=clean;\n  for(const [name,type] of [["Salário","income"],["Investimentos","income"]]){\n    if(!db.categories.some(c=>c.type===type&&String(c.name||"").trim().toLocaleLowerCase("pt-BR")===name.toLocaleLowerCase("pt-BR"))) db.categories.push({id:uid(),name,type});\n  }\n  for(const list of [db.transactions,db.fixed,db.bills]){'''
          if old_norm not in s:
              raise SystemExit('normalize marker not found')
          s=s.replace(old_norm,new_norm,1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Commit and clean up
        shell: bash
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes needed.'
          else
            git commit -m 'Fix salary as income category in launchments'
            git push
          fi
          rm -f .github/workflows/fix-salary-income.yml
          git add -u .github/workflows/fix-salary-income.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Remove one-time salary fix workflow'
          git push
