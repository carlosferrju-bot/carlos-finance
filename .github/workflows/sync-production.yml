name: Sync production to GitHub

on:
  push:
    paths:
      - '.github/workflows/sync-production.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download production
        run: curl -fsSL https://finance-hks5it6j7-carlosferrjr.vercel.app/ -o index.html
      - name: Commit production copy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Sync production Finance app"
          git push
