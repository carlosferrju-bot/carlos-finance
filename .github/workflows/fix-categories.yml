name: Fix category persistence

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch app
        shell: bash
        run: |
          set -e
          if grep -q 'function normalizeCategories' index.html; then
            echo 'Category fix already applied.'
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='''function save(){localStorage.setItem(KEY,JSON.stringify(db));scheduleAutomaticBackup()}\nfunction uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}'''
          insert='''function save(){localStorage.setItem(KEY,JSON.stringify(db));scheduleAutomaticBackup()}\nfunction uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}\n\nfunction normalizeCategories(){\n  if(!Array.isArray(db.categories))db.categories=[];\n  const seen=new Map(), idMap=new Map(), clean=[];\n  for(const c of db.categories){\n    if(!c||typeof c!==\"object\")continue;\n    const name=String(c.name||\"\").trim();\n    if(!name)continue;\n    const type=c.type===\"income\"?\"income\":\"expense\";\n    const key=type+\"|\"+name.toLocaleLowerCase(\"pt-BR\");\n    if(seen.has(key)){if(c.id)idMap.set(c.id,seen.get(key).id);continue}\n    const item={...c,id:c.id||uid(),name,type};\n    seen.set(key,item);\n    clean.push(item);\n  }\n  db.categories=clean;\n  for(const list of [db.transactions,db.fixed,db.bills]){\n    if(!Array.isArray(list))continue;\n    for(const item of list){\n      if(item&&item.category&&idMap.has(item.category))item.category=idMap.get(item.category);\n      if(item&&item.category) { const c=db.categories.find(x=>x.id===item.category); if(c&&\"categoryName\" in item)item.categoryName=c.name; }\n    }\n  }\n}\n'''
          if marker not in s: raise SystemExit('marker not found')
          s=s.replace(marker,insert,1)
          oldcat='''  if(!Array.isArray(db.categories))db.categories=[];\n  const exists=db.categories.some(c=>String(c.name||\"\").trim().toLocaleLowerCase(\"pt-BR\")===name.toLocaleLowerCase(\"pt-BR\")&&c.type===type);'''
          newcat='''  normalizeCategories();\n  const exists=db.categories.some(c=>String(c.name||\"\").trim().toLocaleLowerCase(\"pt-BR\")===name.toLocaleLowerCase(\"pt-BR\")&&c.type===type);'''
          if oldcat not in s: raise SystemExit('submit marker not found')
          s=s.replace(oldcat,newcat,1)
          s=s.replace('''  db.categories.push({id:uid(),name,type});\n  e.target.reset();''','''  db.categories.push({id:uid(),name,type});\n  normalizeCategories();\n  e.target.reset();''',1)
          s=s.replace('''  preservePaidBillStatuses(paidStatusSnapshot);\n\n  save();''','''  preservePaidBillStatuses(paidStatusSnapshot);\n  normalizeCategories();\n\n  save();''',1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix category persistence and deduplicate categories'
          git push
