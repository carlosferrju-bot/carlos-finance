name: Repair legacy ARMA account

on:
  issue_comment:
    types: [created]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.comment.body == 'RUN_LEGACY_ARMA_REPAIR'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install permanent data guard
        shell: python
        run: |
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          marker = "/* PERMANENT_LEGACY_ARMA_GUARD_V8 */"
          if marker in text:
              print("Guard already installed.")
              raise SystemExit(0)

          needle = "initDashboardMonthSelector();\nrender();"
          if needle not in text:
              raise SystemExit("Could not find the application bootstrap.")

          patch = r'''/* PERMANENT_LEGACY_ARMA_GUARD_V8 */
(function(){
  // Permanent data-level tombstone for the specific legacy bill.
  function blockedArmaBill(b){
    if(!b) return false;
    const norm=v=>String(v||"").normalize("NFKC").replace(/[–—−]/g,"-").replace(/\s+/g," ").trim().toLocaleLowerCase("pt-BR");
    return norm(b.desc)==="arma - parcela 1/4"
      && String(b.due||"")==="2026-08-24"
      && Math.abs(Number(b.amount||0)-437.73)<0.005;
  }

  function purgeBlockedArmaBill(){
    if(!Array.isArray(db.bills)) db.bills=[];
    const before=db.bills.length;
    db.bills=db.bills.filter(b=>!blockedArmaBill(b));
    return db.bills.length!==before;
  }

  purgeBlockedArmaBill();

  // Persistence is the authoritative boundary. A sync routine may temporarily
  // recreate the legacy row, but save() removes it before localStorage is written.
  const __armaOriginalSave=save;
  save=function(){
    purgeBlockedArmaBill();
    return __armaOriginalSave.apply(this,arguments);
  };

  // Keep internal and external backups clean too.
  const __armaOriginalSaveInternalBackup=saveInternalBackup;
  saveInternalBackup=async function(){
    purgeBlockedArmaBill();
    return __armaOriginalSaveInternalBackup.apply(this,arguments);
  };

  const __armaOriginalWriteFileBackup=writeFileBackup;
  writeFileBackup=async function(){
    purgeBlockedArmaBill();
    return __armaOriginalWriteFileBackup.apply(this,arguments);
  };

  purgeBlockedArmaBill();
})();
'''

          text = text.replace(needle, patch + "\n" + needle, 1)
          path.write_text(text, encoding="utf-8")

      - name: Commit repair
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: permanently remove legacy ARMA bill"
          git push
