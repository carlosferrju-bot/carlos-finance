<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recuperação — CARLOS FINANCE</title><style>body{font-family:Arial;background:#070a12;color:#fff;max-width:900px;margin:40px auto;padding:20px}button{padding:12px 16px;margin:6px;border:0;border-radius:8px;cursor:pointer}pre{white-space:pre-wrap;background:#111827;padding:16px;border-radius:10px;max-height:500px;overflow:auto}.ok{color:#2ee6a6}.warn{color:#ffd166}</style></head><body><h1>Recuperação de dados — CARLOS FINANCE</h1><p>Esta página é somente de leitura até você escolher explicitamente uma restauração. Ela não executa backup e não sobrescreve seus dados automaticamente.</p><button id="scan">Examinar dados locais</button><button id="restore" disabled>Restaurar cópia interna</button><pre id="out">Aguardando exame…</pre><script>(async()=>{const KEY='neonFinanceV1',DBN=KEY+'_backupDB',out=document.getElementById('out'),restore=document.getElementById('restore');let snap=null;function show(x){out.textContent=typeof x==='string'?x:JSON.stringify(x,null,2)}function openDB(){return new Promise((res,rej)=>{if(!indexedDB)return rej(Error('IndexedDB indisponível'));const r=indexedDB.open(DBN);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}async function getSnap(){const d=await openDB();return new Promise((res,rej)=>{if(!d.objectStoreNames.contains('data')){d.close();res(null);return}const tx=d.transaction('data','readonly'),r=tx.objectStore('data').get('snapshot');r.onsuccess=()=>{const v=r.result;d.close();res(v||null)};r.onerror=()=>{d.close();rej(r.error)}})}document.getElementById('scan').onclick=async()=>{restore.disabled=true;try{let raw=localStorage.getItem(KEY),parsed=null;try{parsed=raw?JSON.parse(raw):null}catch(e){}snap=await getSnap();let info={localStorage:parsed?{transactions:(parsed.transactions||[]).length,bills:(parsed.bills||[]).length,cards:(parsed.cards||[]).length,fixed:(parsed.fixed||[]).length,categories:(parsed.categories||[]).length,bytes:raw?raw.length:0}:null,indexedDBBackup:snap?{createdAt:snap.createdAt||snap.version||'desconhecido',transactions:(snap.data?.transactions||[]).length,bills:(snap.data?.bills||[]).length,cards:(snap.data?.cards||[]).length,fixed:(snap.data?.fixed||[]).length,categories:(snap.data?.categories||[]).length}:null};show(info);restore.disabled=!snap?.data}catch(e){show('Erro ao examinar: '+e.message)}};restore.onclick=async()=>{if(!snap?.data)return;if(!confirm('Restaurar a cópia interna encontrada? Isso substituirá os dados atuais deste navegador.'))return;localStorage.setItem(KEY,JSON.stringify(snap.data));show('RESTAURAÇÃO CONCLUÍDA. Feche esta página e abra o CARLOS FINANCE novamente.')} })()</script></body></html>
