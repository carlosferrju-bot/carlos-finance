<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CARLOS FINANCE — Limpeza técnica</title><body style="font-family:Arial;background:#070a12;color:#fff;padding:40px;text-align:center"><h1 id="t">Corrigindo o carregamento…</h1><p id="s">Removendo versões antigas de cache sem tocar nos seus dados.</p><script>(async()=>{try{if('serviceWorker'in navigator){const rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.map(r=>r.unregister().catch(()=>false)))}if('caches'in window){const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k).catch(()=>false)))}document.getElementById('t').textContent='✓ Carregamento corrigido';document.getElementById('s').textContent='O site agora usará a versão limpa. Seus dados locais não foram apagados.';setTimeout(()=>location.replace('/?clean='+Date.now()),800)}catch(e){document.getElementById('t').textContent='Não foi possível concluir';document.getElementById('s').textContent=e.message}})()</script></body></html>
