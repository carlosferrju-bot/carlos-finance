<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CARLOS FINANCE</title>
<style>html,body{margin:0;padding:0;width:100%;height:100%;background:#050711;color:#fff}#status{font:600 14px Segoe UI,Arial,sans-serif;display:grid;place-items:center;height:100%;color:#8da0bb}</style>
</head>
<body>
<div id="status">Carregando CARLOS FINANCE…</div>
<script>
(async()=>{
  try{
    const response=await fetch('/index.html?patched-source='+Date.now(),{cache:'no-store'});
    if(!response.ok)throw new Error('Falha ao carregar o aplicativo');
    let html=await response.text();
    const patch='<script src="/installment-edit-fix.js?patched='+Date.now()+'"><\\/script>';
    if(!html.includes('/installment-edit-fix.js')){
      const marker='</body>';
      if(!html.includes(marker))throw new Error('Estrutura do aplicativo inválida');
      html=html.replace(marker,patch+'\n'+marker,1);
    }
    document.open();
    document.write(html);
    document.close();
  }catch(error){
    document.getElementById('status').textContent='Não foi possível carregar o CARLOS FINANCE.';
    console.error(error);
  }
})();
</script>
</body>
</html>
